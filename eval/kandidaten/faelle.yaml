  beleg:
    quelle: https://www.sec.gov/Archives/edgar/data/80661/000008066126000086/pgr-20251231.htm
    sha256: 0ec58f7e5ea446b43ed625e774592ef5ab9117c9dcdc6f64f76aa527951747b7
    seite: 2
    zitat: The Progressive Corporation, an insurance holding company
    auszug: 'PART I ITEM 1. BUSINESS General Development of Business The Progressive Corporation, an insurance
