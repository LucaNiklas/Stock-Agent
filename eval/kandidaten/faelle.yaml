j2:
- id: J2_APPLE_01
  unternehmen: Apple
  isin: US0378331005
  fehlerart: keiner
  aussage: Apple verkauft neben Geräten eine Reihe zugehöriger Dienste.
  beleg:
    quelle: https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/aapl-20250927.htm
    sha256: 7edcaa2e56bc2896150b7b44e5b5b1683454b28ca6ef1a92921e373da7b039ac
    seite: 3
    zitat: sells a variety of related services
    auszug: Each of the terms the “Company” and “Apple” as used herein refers collectively to Apple Inc.
      and its wholly owned subsidiaries, unless otherwise stated. PART I Item 1. Business Company Background
      The Company designs, manufactures and markets smartphones, personal computers, tablets, wearables
      and accessories, and sells a variety of related services. The Company’s fiscal year is the 52- or
      53-week period that ends on the last Saturday of September. Products iPhone iPhone® is the Company’s
      line of smartphones based on its iOS operating system. The iPhone line includes iPhone 17 Pro, iPhone
      Air™, iPhone 17, iPhone 16 and iPhone 16e. Mac Mac® is the Company’s line of personal computers
      based on its macOS® operating system.
  erwartet:
  - supported
- id: J2_APPLE_02
  unternehmen: Apple
  isin: US0378331005
  fehlerart: erfundene_aussage
  aussage: Apple fertigt seine Produkte überwiegend in eigenen Werken.
  beleg:
    quelle: https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/aapl-20250927.htm
    sha256: 7edcaa2e56bc2896150b7b44e5b5b1683454b28ca6ef1a92921e373da7b039ac
    seite: 10
    zitat: The Company depends on component and product manufacturing and logistical services provided
      by outsourcing partners
    auszug: New products, services and technologies may replace or supersede existing offerings and may
      produce lower revenues and lower profit margins. The Company may not be able to successfully manage
      future introductions and transitions of products and services, which can materially adversely affect
      the Company’s business, reputation, results of operations, financial condition and stock price.
      The Company depends on component and product manufacturing and logistical services provided by outsourcing
      partners, many of which are located outside of the U.S. A significant majority of the Company’s
      manufacturing is performed in whole or in part by outsourcing partners located primarily in China
      mainland, India, Japan, South Korea, Taiwan and Vietnam, in addition to sourcing from partners and
      facilities located in the U.S.
  erwartet:
  - not_supported
  - contradicted
- id: J2_JPM_01
  unternehmen: JPMorgan
  isin: US46625H1005
  fehlerart: keiner
  aussage: 'JPMorgan berichtet in drei Geschäftssegmenten: Privatkunden, Firmen- und Investmentbank sowie
    Vermögensverwaltung.'
  beleg:
    quelle: https://www.sec.gov/Archives/edgar/data/19617/000162828026008131/jpm-20251231.htm
    sha256: 15e7566e3f36b63637d70a864d290969d73c575961be4583f4ca1466427ed325
    seite: 3
    zitat: the Firm has three reportable business segments
    auszug: Information on the Firm's website, including documents on the website that are referenced
      in this Form 10-K, is not incorporated by reference into this Annual Report on Form 10-K for the
      year ended December 31, 2025 (“2025 Form 10-K” or “Form 10-K”) or the Firm’s other filings with
      the SEC. Business segments & Corporate For management reporting purposes, the Firm has three reportable
      business segments – Consumer & Community Banking (“CCB”), Commercial & Investment Bank (“CIB”) and
      Asset & Wealth Management (“AWM”) – with the remaining activities in Corporate. The Firm’s consumer
      business segment is CCB, and the Firm’s wholesale business segments are CIB and AWM. A description
      of the Firm’s reportable business segments and the products and services that they provide to their
      respective client bases, as well as a description of Corporate activities, is provided in the Management’s
      discussion and analysis of financial condition and results of operations section of this Form 10-K
      (“Management’s discussion and analysis” or “MD&A”) under the heading “Business Segment & Corporate
      Results,” which begins on page 46, and in Note 32. Competition JPMorganChase and its subsidiaries
      and affiliates operate in highly competitive environments.
  erwartet:
  - supported
- id: J2_JPM_02
  unternehmen: JPMorgan
  isin: US46625H1005
  fehlerart: erfundene_aussage
  aussage: JPMorgan sieht in seinen Märkten kaum Wettbewerb.
  beleg:
    quelle: https://www.sec.gov/Archives/edgar/data/19617/000162828026008131/jpm-20251231.htm
    sha256: 15e7566e3f36b63637d70a864d290969d73c575961be4583f4ca1466427ed325
    seite: 30
    zitat: JPMorganChase operates in a highly competitive environment
    auszug: Part I Competition in the financial services industry could lead to negative effects on JPMorganChase’s
      results of operations. JPMorganChase operates in a highly competitive environment in which it must
      constantly adapt to changes in financial regulation, technological advances and economic conditions.
      JPMorganChase expects that competition in the financial services industry will remain intense, with
      new competitors in the financial services industry continuing to emerge.
  erwartet:
  - not_supported
  - contradicted
- id: J2_PROGRESSIVE_01
  unternehmen: Progressive
  isin: US7433151039
  fehlerart: keiner
  aussage: Das Privatkundengeschäft stellt den größten Teil der gebuchten Prämien.
  beleg:
    quelle: https://www.sec.gov/Archives/edgar/data/80661/000008066126000086/pgr-20251231.htm
    sha256: 0ec58f7e5ea446b43ed625e774592ef5ab9117c9dcdc6f64f76aa527951747b7
    seite: 2
    zitat: The Personal Lines segment accounted for 87% of our total net premiums written in 2025
    auszug: In California, we operate a separate agency auto organization with its own management and
      customer relationship management organization. Personal Lines Our Personal Lines operating segment
      writes insurance for personal autos and special lines products (e.g., recreational vehicles, such
      as motorcycles, RVs, and watercraft), collectively referred to as our personal vehicle business,
      and personal residential property insurance for homeowners and renters. The Personal Lines segment
      accounted for 87% of our total net premiums written in 2025, 85% in 2024, and 84% in 2023. For 2025,
      our personal vehicle products represented 96% of our total Personal Lines net premiums written,
      95% for 2024, and 94% for 2023. We write our personal vehicle insurance in all states, however,
      our special lines products are not written in the District of Columbia. •Personal auto insurance
      represented 95% of our total personal vehicle net premiums written in both 2025 and 2024, and 94%
      in 2023.
  erwartet:
  - supported
