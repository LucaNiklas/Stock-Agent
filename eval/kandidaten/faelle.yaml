  aussage: Realty Income zahlt die Dividende einmal im Jahr aus.
  beleg:
    quelle: https://www.sec.gov/Archives/edgar/data/726728/000072672826000011/o-20251231.htm
    sha256: 2da16aeef5906c08ff349fec5438585be57be33b37b8d40bb02eacf9ee6da754
    seite: 4
    zitat: deliver dependable monthly dividends
    auszug: As of December 31, 2025, we have a portfolio of over 15,500 properties in all 50 states of
      the United States ("U.S."), the United Kingdom ("U.K."), and eight other countries in Europe. We
      are known as “The Monthly Dividend Company®” and have a mission to invest in people and places to
      deliver dependable monthly dividends that increase over time. Since our listing on the NYSE in 1994,
      we have had 133 dividend increases and are a member of the S&P 500 Dividend Aristocrats® index for
      having increased our dividend for over 31 consecutive years. Our Primary Business Activities Our
      primary business is the acquisition, ownership, and active management of freestanding commercial
      properties leased under long‑term net lease agreements to a diversified base of operators, including
      a blend of investment grade, investment grade equivalent, and other creditworthy clients.
  erwartet:
  - not_supported
