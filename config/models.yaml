# Modellzuordnung, siehe docs/spec/08-agentenarchitektur.md Abschnitt 8.7.
# Werte für Claude sind die Aliase, die Claude Code im Subagent-Feld `model` versteht.
# Änderung erfordert einen Goldstandard-Lauf (11.6) und einen Changelog-Eintrag.

klassen:
  fast: haiku        # Websuche, Dokumente finden, Zusammensuchen
  standard: sonnet   # Texte, Extraktion, Prüfungen
  strong: opus       # nur die anspruchsvollsten Schritte
  extern: gemini     # optional über Gemini CLI (8.8), sonst Rückfall

extern:
  aktiv: false       # wird in Schritt 10 nach erfolgreichem Test eingeschaltet
  rueckfall: standard

agenten:
  A0_kategorie: fast
  A1_datenbeschaffung: fast
  A2_extraktion_1: standard
  A2_extraktion_2: extern
  A3_fundamental: strong
  A4_qualitativ: standard
  A5_bewertung: strong
  A6_insider: standard
  A7_gegenposition: strong
  A9_synthese: standard
  F1_forensik: strong
  J1_zahlen: fast
  J2_belege: extern
  J3_jury: [strong, standard, extern]
  J3_jury_rueckfall_extern: fast
  J4_endkontrolle: standard

# Bauschritt 6: Tiefenanalyse (SPEC 8.6, 8.10, HR-18). Agenten-Kennung im Lauf -> Vorlage in
# agents_src/ und Eintrag unter `agenten` oben.
tiefenanalyse:
  agenten:
    A1: {vorlage: a1-datenbeschaffung, modell_von: A1_datenbeschaffung}
    A3: {vorlage: a3-fundamental, modell_von: A3_fundamental}
    A4: {vorlage: a4-qualitativ, modell_von: A4_qualitativ}
    A5: {vorlage: a5-bewertung, modell_von: A5_bewertung}
    A6: {vorlage: a6-insider, modell_von: A6_insider}
    A7: {vorlage: a7-gegenposition, modell_von: A7_gegenposition}
    A3E: {vorlage: a3-fundamental, modell_von: A3_fundamental}
    J1: {vorlage: j1-zahlenpruefer, modell_von: J1_zahlen}
    J2: {vorlage: j2-belegpruefer, modell_von: J2_belege}
    A9: {vorlage: a9-synthese, modell_von: A9_synthese}

# Aufwand und harte Grenzen (HR-18, SPEC 8.10)
aufwand:
  max_turns:            # je Vorlage, wird ins Frontmatter geschrieben
    a1-datenbeschaffung: 15
    a3-fundamental: 40
    a4-qualitativ: 40
    a5-bewertung: 25
    a6-insider: 10
    a7-gegenposition: 30
    j1-zahlenpruefer: 60
    j2-belegpruefer: 40
    a9-synthese: 10
  max_tiefenanalysen_gleichzeitig: 3   # HR-18 max_deep_analyses_per_run
  max_auftraege_je_lauf: 20            # alle Agentenaufträge einer Tiefenanalyse zusammen
  max_parallel: 3                      # gleichzeitige Aufträge, die `stockagent next` nennt
  max_wiederholungen: 2                # abgelehnte Antwort höchstens zweimal zurück (SPEC 8.6)
  nachforderung_runden: 1              # SPEC 8.5
  erwiderung_runden: 1                 # SPEC 8.3 A7 (höchstens 2)
  zeitlimit_minuten: 60                # je Tiefenanalyse (SPEC 8.6 Default 20, siehe ADR 0008)
  berichte_anzahl: 2                   # Jahresberichte als Text: aktueller und Vorjahr (Risikofaktoren)

# Prüfung (SPEC 11.2 Ebene 1)
pruefung:
  j1_match: "0.005"     # relative Abweichung bis 0,5 % gilt als Übereinstimmung
  j1_rundung: "0.02"    # bis 2 % als Rundung (Warnung), darüber mismatch
  # Ein mismatch bei einer dieser Kennzahlen eskaliert den Fall
  kernkennzahlen: [gross_margin, ebit_margin, fcf_margin, roic, fcf, net_debt, net_debt_to_ebitda,
                   market_cap, enterprise_value, pe, ev_ebit, fcf_yield, wacc, implied_growth]
