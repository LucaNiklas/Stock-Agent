    PT: [PL]
    IE: [ID, LN]
    PL: [PW]
    GR: [GA]
    HU: [HB]
    CZ: [CP]
    JP: [JP, JT]
    HK: [HK]
    CN: [CG, CS, HK]
    KR: [KS, KQ]
