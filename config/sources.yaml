# Datenquellen, siehe docs/spec/07-datenquellen-und-datenschicht.md.
# Nur Domains aus dieser Datei dürfen ohne Rückfrage abgerufen werden (SPEC 16.8).

user_agent: "stockagent/0.1 (private Aktienrecherche; github.com/LucaNiklas/Stock-Agent)"

deutsche_boerse:
  # Die Datei-Links enthalten wechselnde Kennungen, deshalb wird die Downloadseite gelesen.
  frankfurt_page: https://www.cashmarket.deutsche-boerse.com/cash-en/trading/Tradable-Instruments-Xetra/boersefrankfurt
  frankfurt_file: t7-xfra-BF-allTradableInstruments.csv
  xetra_page: https://www.cashmarket.deutsche-boerse.com/cash-en/trading/Tradable-Instruments-Xetra/Downloads
  xetra_file: t7-xetr-allTradableInstruments.csv

gleif:
  isin_lei_url: https://mapping.gleif.org/api/v2/isin-lei/latest/download
  api_url: https://api.gleif.org/api/v1/lei-records
  batch_size: 200          # LEIs je API-Abfrage
  api_pause_s: 0.5         # Pause zwischen API-Abfragen
  # Aufräumregel (ADR 0001): GLEIF-Rohdaten nur der letzten N übernommenen Stände behalten.
  # GLEIF liefert keine Finanzwerte und ist jederzeit neu abrufbar, deshalb Ausnahme von SPEC 7.6.
  keep_snapshots: 2

universe:
  max_change_pct: 5        # größere Abweichung zur letzten Liste wird nicht ohne --force übernommen
  min_refresh_days: 6      # seltener als wöchentlich neu laden

sec:
  # Die SEC verlangt Name und E-Mail im User-Agent. Der Wert steht in der Umgebungsvariablen
  # (oder in .env), nie im Repository.
  user_agent_env: SEC_USER_AGENT
  tickers_url: https://www.sec.gov/files/company_tickers_exchange.json
  submissions_url: https://data.sec.gov/submissions/CIK{cik}.json
  companyfacts_url: https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json
  # Ein Konzept für alle Melder in einem Kalenderjahr (Vergleichsgruppe nach Umsatz, Schritt 5)
  frames_url: https://data.sec.gov/api/xbrl/frames/{taxonomie}/{konzept}/USD/{zeitraum}.json
  filing_index_url: https://www.sec.gov/Archives/edgar/data/{cik_int}/{accession_nodash}/index.json
  filing_file_url: https://www.sec.gov/Archives/edgar/data/{cik_int}/{accession_nodash}/{name}
  max_requests_per_s: 8     # die SEC erlaubt höchstens 10
  master_refresh_days: 6    # Stammdaten (SIC, Adresse) seltener als wöchentlich neu laden
  # Nur Werte aus Abschlussberichten und ihren Korrekturen. Andere Formulare (etwa DEF 14A mit
  # der Tabelle Pay versus Performance) taggen Abschlusswerte gerundet oder anders abgegrenzt.
  report_forms: [10-K, 10-K/A, 10-Q, 10-Q/A, 10-KT, 10-KT/A, 10-QT, 10-QT/A, 20-F, 20-F/A,
                 40-F, 40-F/A, 6-K, 6-K/A]

esef:
  # ESEF-Jahresberichte der EU über filings.xbrl.org (SPEC 7.2, ADR 0009). Ohne Schlüssel.
  # Abdeckung ab 2020. Deutsche Berichte fehlen dort (Unternehmensregister nicht angebunden).
  base_url: https://filings.xbrl.org
  filings_url: https://filings.xbrl.org/api/entities/{lei}/filings
  pause_s: 1.0
  timeout_s: 180
  jahre: 6               # so viele Einreichungen je Firma, neueste zuerst
  max_fehler: 0          # Einreichungen mit Validierungsfehlern von filings.xbrl.org auslassen

openfigi:
  # ISIN -> Ticker (ADR 0002). Ohne API-Schlüssel, Grenzen live gemessen am 13.10.2026
  # (Antwort-Header ratelimit-policy: 25;w=60, mehr als 10 Aufträge je Anfrage ergibt HTTP 413).
  mapping_url: https://api.openfigi.com/v3/mapping
  jobs_per_request: 10
  requests_per_minute: 25
  # Neu zuordnen, wenn die letzte Prüfung älter ist
  recheck_days: 90

yahoo:
  # Kursquelle (ADR 0005, Lucas Entscheidung 14.10.2026). Inoffizielle Schnittstelle von Yahoo
  # Finance, dieselbe, die die Bibliothek yfinance nutzt. Nur persönliche Nutzung, Abruf nur für
  # angefragte Titel und ihre Vergleichsgruppe, langsam. Wir melden uns mit unserem eigenen
  # User-Agent und geben uns nicht als Browser aus. Lehnt Yahoo das ab, wird das gemeldet.
  enabled: true
  chart_url: https://query2.finance.yahoo.com/v8/finance/chart/{symbol}
  erstabruf: 10y          # Geschichte beim ersten Abruf eines Titels
  nachabruf: 3mo          # danach nur das Neueste, überlappend
  pause_s: 2.0            # Pause zwischen zwei Abrufen
  aktuell_tage: 1         # Kurse jünger als das nicht neu abrufen
  veraltet_tage: 10       # letzter Kurs älter als das: Warnung (Handel ausgesetzt, Delisting)
  # Bloomberg-Börsenkürzel aus OpenFIGI (Ländersammelkürzel) -> Endung des Yahoo-Symbols
  endungen:
    US: ""
    CN: ".TO"
    CV: ".V"
    GR: ".DE"
    GY: ".DE"
    GF: ".F"
    LN: ".L"
    FP: ".PA"
    NA: ".AS"
    IM: ".MI"
    SM: ".MC"
    SQ: ".MC"
    SS: ".ST"
    NO: ".OL"
    DC: ".CO"
    FH: ".HE"
    SW: ".SW"
    SE: ".SW"
    AV: ".VI"
    BB: ".BR"
    PL: ".LS"
    ID: ".IR"
    PW: ".WA"
    GA: ".AT"
    HB: ".BD"
    CP: ".PR"
    JP: ".T"
    JT: ".T"
    HK: ".HK"
    CG: ".SS"
    CS: ".SZ"
    KS: ".KS"
    KQ: ".KQ"
    TT: ".TW"
    SP: ".SI"
    AU: ".AX"
    AT: ".AX"
    NZ: ".NZ"
    SJ: ".JO"
    IJ: ".JK"
    TB: ".BK"
    MK: ".KL"
    IT: ".TA"
    IS: ".NS"
    IB: ".BO"
  # Heimatbörse je Land (Hauptsitz laut Universum), in dieser Reihenfolge versucht. Danach die
  # USA (viele ausländische Firmen mit US-Notierung) und zuletzt Xetra und Frankfurt, wo jede
  # Aktie des Universums gehandelt wird, aber bei kleinen Werten mit wenig Umsatz.
  heimatboerse:
    US: [US]
    CA: [CN, CV]
    DE: [GR, GY]
    GB: [LN]
    FR: [FP]
    NL: [NA]
    IT: [IM]
    ES: [SM, SQ]
    SE: [SS]
    NO: [NO]
    DK: [DC]
    FI: [FH]
    CH: [SW, SE]
    AT: [AV]
    BE: [BB]
    PT: [PL]
    IE: [ID, LN]
    PL: [PW]
    GR: [GA]
    HU: [HB]
    CZ: [CP]
    JP: [JP, JT]
    HK: [HK]
    CN: [CG, CS, HK]
    KR: [KS, KQ]
    TW: [TT]
    SG: [SP]
    AU: [AU, AT]
    NZ: [NZ]
    ZA: [SJ]
    ID: [IJ]
    TH: [TB]
    MY: [MK]
    IL: [IT]
    IN: [IS, IB]
  rueckfall: [US, GR, GY, GF]

ecb:
  # Referenzkurse der EZB (SPEC 5.2 Nr. 1), Einheiten der Währung je 1 EUR, täglich gegen 16 Uhr.
  # Ohne Schlüssel. Ein Abruf liefert alle Währungen ab `start`, danach nur das Neueste.
  url: https://data-api.ecb.europa.eu/service/data/EXR/D.{waehrungen}.EUR.SP00.A?format=csvdata&detail=dataonly&startPeriod={start}
  start: "2015-01-01"
  aktuell_tage: 1
  waehrungen: [USD, GBP, JPY, HKD, CAD, AUD, CHF, SEK, NOK, DKK, PLN, CZK, HUF, CNY, KRW, SGD,
               ZAR, ILS, INR, IDR, THB, MYR, NZD, BRL, MXN, TRY, ISK, RON, PHP]
  # Unterwährungen (SPEC 5.2 Nr. 10): Kurse in Pence, Cent oder Agorot, Faktor 100 zur Hauptwährung
  unterwaehrungen: {GBp: GBP, GBX: GBP, ZAc: ZAR, ZAC: ZAR, ILA: ILS}

zinsen:
  # Risikofreier Zins 10 Jahre (SPEC 3.6 Nr. 3). Ohne Schlüssel. Werte in Prozent.
  # EUR: Zinsstrukturkurve der Bundesbank (Svensson, börsennotierte Bundeswertpapiere)
  bundesbank_url: https://api.statistiken.bundesbank.de/rest/data/BBSIS/D.I.ZST.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A?format=csv&startPeriod={start}
  # USD: Daily Treasury Par Yield Curve, Spalte "10 Yr", eine Datei je Kalenderjahr
  treasury_url: https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{jahr}/all?type=daily_treasury_yield_curve&field_tdr_date_value={jahr}&page&_format=csv
  # GBP: Bank of England, Serie IUDMNPY (10 Jahre, nominal, Par Yield), täglich (Bauschritt 7)
  boe_url: https://www.bankofengland.co.uk/boeapps/database/_iadb-fromshowcolumns.asp?csv.x=yes&Datefrom={start}&Dateto=now&SeriesCodes=IUDMNPY&CSVF=TN&UsingCodes=Y&VPD=Y&VFD=N
  # CHF (SNB data.snb.ch, Cube rendoblid) endet im Juli 2025, DKK (api.statbank.dk) nicht
  # erreichbar: beide vorerst ohne risikofreien Zins (ADR 0009)
  start: "2015-01-01"
  aktuell_tage: 1

damodaran:
  # Datensätze von Aswath Damodaran, NYU Stern (SPEC 3.6 Nr. 3, 7.3), frei zugänglich.
  # Gespeichert wird je Datensatz der zuletzt geladene Stand mit Datum. Betas und
  # Branchenzuordnung erscheinen einmal im Jahr (Januar), die Risikoprämie monatlich.
  betas_url: https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/Betas.html
  ratings_url: https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/ratings.html
  wacc_url: https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/wacc.html
  erp_url: https://pages.stern.nyu.edu/~adamodar/pc/implprem/ERPbymonth.xlsx
  firms_url: https://pages.stern.nyu.edu/~adamodar/pc/datasets/indname.xlsx
  erp_spalte: "ERP (T12m)"   # Damodarans Standardwert der impliziten Prämie
  aktuell_tage: 7            # jünger: nicht neu laden
  # Endung des Yahoo-Symbols -> Börsenkürzel bei Damodaran ("Börse:Kürzel"), in dieser Reihenfolge
  boersen:
    "": [NYSE, NasdaqGS, NasdaqGM, NasdaqCM, NYSEAM, BATS, OTCPK]
    ".DE": [XTRA, DB]
    ".F": [DB, XTRA]
    ".L": [LSE, AIM]
    ".PA": [ENXTPA]
    ".AS": [ENXTAM]
    ".BR": [ENXTBR]
    ".LS": [ENXTLS]
    ".SW": [SWX]
    ".MI": [BIT]
    ".MC": [BME]
    ".ST": [OM]
    ".CO": [CPSE]
    ".HE": [HLSE]
    ".OL": [OB]
    ".VI": [WBAG]
    ".IR": [ISE]
    ".WA": [WSE]
    ".AT": [ATSE]
    ".T": [TSE]
    ".HK": [SEHK]
    ".TO": [TSX]
    ".V": [TSXV]
    ".AX": [ASX]
