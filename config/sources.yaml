# Datenquellen, siehe docs/spec/07-datenquellen-und-datenschicht.md.
# Nur Domains aus dieser Datei dürfen ohne Rückfrage abgerufen werden (SPEC 16.8).

user_agent: "stockagent/0.1 (private Aktienrecherche; github.com/LucaNiklas/Stock-Agent)"

deutsche_boerse:
  # Die Datei-Links enthalten wechselnde Kennungen, deshalb wird die Downloadseite gelesen.
  frankfurt_page: https://www.cashmarket.deutsche-boerse.com/cash-en/trading/Tradable-Instruments-Xetra/boersefrankfurt
  frankfurt_file: t7-xfra-BF-allTradableInstruments.csv
  xetra_page: https://www.cashmarket.deutsche-boerse.com/cash-en/trading/Tradable-Instruments-Xetra/Downloads
  xetra_file: t7-xetr-allTradableInstruments.csv

gleif:
  isin_lei_url: https://mapping.gleif.org/api/v2/isin-lei/latest/download
  api_url: https://api.gleif.org/api/v1/lei-records
  batch_size: 200          # LEIs je API-Abfrage
  api_pause_s: 0.5         # Pause zwischen API-Abfragen
  # Aufräumregel (ADR 0001): GLEIF-Rohdaten nur der letzten N übernommenen Stände behalten.
  # GLEIF liefert keine Finanzwerte und ist jederzeit neu abrufbar, deshalb Ausnahme von SPEC 7.6.
  keep_snapshots: 2

universe:
  max_change_pct: 5        # größere Abweichung zur letzten Liste wird nicht ohne --force übernommen
  min_refresh_days: 6      # seltener als wöchentlich neu laden

sec:
  # Die SEC verlangt Name und E-Mail im User-Agent. Der Wert steht in der Umgebungsvariablen
  # (oder in .env), nie im Repository.
  user_agent_env: SEC_USER_AGENT
  tickers_url: https://www.sec.gov/files/company_tickers_exchange.json
  submissions_url: https://data.sec.gov/submissions/CIK{cik}.json
  companyfacts_url: https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json
  filing_index_url: https://www.sec.gov/Archives/edgar/data/{cik_int}/{accession_nodash}/index.json
  filing_file_url: https://www.sec.gov/Archives/edgar/data/{cik_int}/{accession_nodash}/{name}
  max_requests_per_s: 8     # die SEC erlaubt höchstens 10
  master_refresh_days: 6    # Stammdaten (SIC, Adresse) seltener als wöchentlich neu laden
  # Nur Werte aus Abschlussberichten und ihren Korrekturen. Andere Formulare (etwa DEF 14A mit
  # der Tabelle Pay versus Performance) taggen Abschlusswerte gerundet oder anders abgegrenzt.
  report_forms: [10-K, 10-K/A, 10-Q, 10-Q/A, 10-KT, 10-KT/A, 10-QT, 10-QT/A, 20-F, 20-F/A,
                 40-F, 40-F/A, 6-K, 6-K/A]

openfigi:
  # ISIN -> Ticker (ADR 0002). Ohne API-Schlüssel, Grenzen live gemessen am 13.10.2026
  # (Antwort-Header ratelimit-policy: 25;w=60, mehr als 10 Aufträge je Anfrage ergibt HTTP 413).
  mapping_url: https://api.openfigi.com/v3/mapping
  jobs_per_request: 10
  requests_per_minute: 25
  # Neu zuordnen, wenn die letzte Prüfung älter ist
  recheck_days: 90

yahoo:
  # Kursquelle (ADR 0005, Lucas Entscheidung 14.10.2026). Inoffizielle Schnittstelle von Yahoo
  # Finance, dieselbe, die die Bibliothek yfinance nutzt. Nur persönliche Nutzung, Abruf nur für
  # angefragte Titel und ihre Vergleichsgruppe, langsam. Wir melden uns mit unserem eigenen
  # User-Agent und geben uns nicht als Browser aus. Lehnt Yahoo das ab, wird das gemeldet.
  enabled: true
  chart_url: https://query2.finance.yahoo.com/v8/finance/chart/{symbol}
  erstabruf: 10y          # Geschichte beim ersten Abruf eines Titels
  nachabruf: 3mo          # danach nur das Neueste, überlappend
  pause_s: 2.0            # Pause zwischen zwei Abrufen
  aktuell_tage: 1         # Kurse jünger als das nicht neu abrufen
  veraltet_tage: 10       # letzter Kurs älter als das: Warnung (Handel ausgesetzt, Delisting)
  # Bloomberg-Börsenkürzel aus OpenFIGI (Ländersammelkürzel) -> Endung des Yahoo-Symbols
  endungen:
    US: ""
    CN: ".TO"
    CV: ".V"
    GR: ".DE"
    GY: ".DE"
    GF: ".F"
    LN: ".L"
    FP: ".PA"
    NA: ".AS"
    IM: ".MI"
    SM: ".MC"
    SQ: ".MC"
    SS: ".ST"
    NO: ".OL"
    DC: ".CO"
    FH: ".HE"
    SW: ".SW"
    SE: ".SW"
    AV: ".VI"
    BB: ".BR"
    PL: ".LS"
    ID: ".IR"
    PW: ".WA"
    GA: ".AT"
    HB: ".BD"
    CP: ".PR"
    JP: ".T"
    JT: ".T"
    HK: ".HK"
    CG: ".SS"
    CS: ".SZ"
    KS: ".KS"
    KQ: ".KQ"
    TT: ".TW"
    SP: ".SI"
    AU: ".AX"
    AT: ".AX"
    NZ: ".NZ"
    SJ: ".JO"
    IJ: ".JK"
    TB: ".BK"
    MK: ".KL"
    IT: ".TA"
    IS: ".NS"
    IB: ".BO"
  # Heimatbörse je Land (Hauptsitz laut Universum), in dieser Reihenfolge versucht. Danach die
  # USA (viele ausländische Firmen mit US-Notierung) und zuletzt Xetra und Frankfurt, wo jede
  # Aktie des Universums gehandelt wird, aber bei kleinen Werten mit wenig Umsatz.
