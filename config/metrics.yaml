# Formelregister, siehe docs/spec/12-analyseformat-und-reproduzierbarkeit.md Abschnitt 12.2.
# Jede Kennzahl hier hat genau eine Funktion in src/stockagent/core/kennzahlen.py oder scores.py,
# registriert über @metric in core/registry.py (HR-06). Jede rechnet schrittweise über den
# Rechenweg aus core/calc.py, `pruefpunkte` sind die Pflicht-Prüfpunkte (HR-19, SPEC 12.7).
# CP-05 (Plausibilität gegen die eigene Historie) läuft für jede Kennzahl als Warnung in
# core/trends.py über die Zeitreihe der Kennzahl.
# Eingaben mit "|" sind Alternativen, "+" eine Summe von Teilen. Optionale Eingaben zählen 0,
# wenn nicht gemeldet, mit Vermerk im Rechenweg.
# Bewertungskennzahlen mit Börsenkurs (EV, KGV, FCF-Rendite, Altman Z) folgen in Bauschritt 4.

methodology_version: "1.0"

# Trends je Kennzahl (SPEC 3.4, core/trends.py)
trends:
  max_jahre: 10                # Länge der Reihe für Streuung und Steigung
  mindest_jahre: 5             # darunter keine Streuung und keine Steigung (SPEC 3.4 Nr. 1)
  # CP-05 gegen die eigene Historie nutzt config/quality.yaml ausreisser (Schwelle 4,
  # mindestens 4 Vorjahre)

metrics:
- id: gross_margin
  version: '1.0'
  name: Bruttomarge
  formel: Bruttoergebnis / Umsatz
  definition: Bruttoergebnis gemeldet (GrossProfit) oder Umsatz minus Umsatzkosten. Liegen beide vor,
    Gegenrechnung (CP-04). Ohne Umsatzkosten nicht berechenbar (SPEC 3.3).
  eingaben:
  - gross_profit|cost_of_revenue
  - revenue
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: &id001
  - standard
  - growth
  - utilities
  - cyclicals
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_gross_margin.py
- id: ebit_margin
  version: '1.0'
  name: EBIT-Marge
  formel: EBIT / Umsatz
  definition: EBIT = operatives Ergebnis (OperatingIncomeLoss).
  eingaben:
  - ebit
  - revenue
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_ebit_margin.py
- id: fcf_margin
  version: '1.0'
  name: FCF-Marge
  formel: Free Cashflow / Umsatz
  definition: FCF wie Kennzahl fcf.
  eingaben:
  - operating_cash_flow
  - capex
  - revenue
  optionale_eingaben:
  - capex_intangibles
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_fcf_margin.py
- id: gp_to_assets
  version: '1.0'
  name: Bruttoergebnis zu Bilanzsumme
  formel: Bruttoergebnis / Bilanzsumme
  definition: Bilanzsumme zum Jahresende wie bei Novy-Marx.
  eingaben:
  - gross_profit|cost_of_revenue
  - revenue
  - total_assets
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Novy-Marx (2013), The Other Side of Value, Journal of Financial Economics 108
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_gp_to_assets.py
- id: roe
  version: '1.0'
  name: Eigenkapitalrendite
  formel: Jahresüberschuss / durchschnittliches Eigenkapital
  definition: Durchschnitt = (Vorjahresende + Jahresende) / 2. Nicht definiert bei negativem Eigenkapital
    am Anfang oder Ende. Gegenrechnung über DuPont (CP-04).
  eingaben:
  - net_income
  - equity
  - revenue
  - total_assets
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  - CP-04
  tests:
  - tests/metrics/test_roe.py
- id: roa
  version: '1.0'
  name: Gesamtkapitalrendite
  formel: Jahresüberschuss / durchschnittliche Bilanzsumme
  definition: Durchschnitt = (Vorjahresende + Jahresende) / 2.
  eingaben:
  - net_income
  - total_assets
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_roa.py
- id: roic
  version: '1.0'
  name: Rendite auf investiertes Kapital
  formel: NOPAT / durchschnittliches investiertes Kapital
  definition: NOPAT = EBIT * (1 - Steuersatz). Steuersatz = Steuern / Vorsteuerergebnis, begrenzt auf
    [0; 0,35], bei Vorsteuerverlust 0. Investiertes Kapital = Eigenkapital + Finanzschulden + Leasingverbindlichkeiten
    - liquide Mittel. Finanzschulden aus Teilen (zwei Wege mit CP-04), Leasing = Operating + Finance.
  eingaben:
  - ebit
  - income_tax
  - pretax_income
  - equity
  - debt_long_total|debt_noncurrent
  - cash
  optionale_eingaben:
  - debt_current
  - short_term_borrowings
  - commercial_paper
  - lease_operating
  - lease_finance
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_roic.py
- id: dupont
  version: '1.0'
  name: ROE nach DuPont
  formel: Nettomarge * Kapitalumschlag * Hebel
  definition: Nettomarge = Jahresüberschuss / Umsatz, Kapitalumschlag = Umsatz / durchschnittliche Bilanzsumme,
    Hebel = durchschnittliche Bilanzsumme / durchschnittliches Eigenkapital. Die Teile stehen im Rechenweg.
    Muss mit roe übereinstimmen (CP-04).
  eingaben:
  - net_income
  - revenue
  - total_assets
  - equity
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  - CP-04
  tests:
  - tests/metrics/test_dupont.py
- id: revenue_cagr_3y
  version: '1.0'
  name: Umsatzwachstum 3 Jahre (CAGR)
  formel: (Umsatz t / Umsatz t-3) ^ (1/3) - 1
  definition: Nur bei positivem Anfangs- und Endwert.
  eingaben:
  - revenue
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_revenue_cagr_3y.py
- id: revenue_cagr_5y
  version: '1.0'
  name: Umsatzwachstum 5 Jahre (CAGR)
  formel: (Umsatz t / Umsatz t-5) ^ (1/5) - 1
  definition: Nur bei positivem Anfangs- und Endwert.
  eingaben:
  - revenue
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_revenue_cagr_5y.py
- id: eps_cagr_5y
  version: '1.0'
  name: Wachstum Gewinn je Aktie 5 Jahre (CAGR)
  formel: (EPS t / EPS t-5) ^ (1/5) - 1
  definition: Verwässertes EPS, um Splits bereinigt, nur bei positivem Anfangs- und Endwert. Rückkaufgetriebenes
    Wachstum zeigt share_count_change_3y.
  eingaben:
  - eps_diluted
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards:
  - standard
  - growth
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_eps_cagr_5y.py
- id: fcf_per_share_cagr_5y
  version: '1.0'
  name: Wachstum FCF je Aktie 5 Jahre (CAGR)
  formel: (FCF/Aktie t / FCF/Aktie t-5) ^ (1/5) - 1
  definition: Aktienzahl verwässert, um Splits bereinigt. Nur bei positivem FCF in beiden Jahren.
  eingaben:
  - operating_cash_flow
  - capex
  - shares_diluted
  optionale_eingaben:
  - capex_intangibles
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_fcf_per_share_cagr_5y.py
- id: share_count_change_3y
  version: '1.0'
  name: Veränderung der Aktienanzahl 3 Jahre
  formel: Aktien t / Aktien t-3 - 1
  definition: Verwässerte gewichtete Aktienanzahl, um Splits bereinigt. Positiv = Verwässerung.
  eingaben:
  - shares_diluted
  einheit: ratio
  richtung: lower_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_share_count_change_3y.py
- id: fcf
  version: '1.0'
  name: Free Cashflow
  formel: Operativer Cashflow - Investitionen in Sachanlagen und immaterielle Werte
  definition: 'US-GAAP: Leasingtilgung ist nicht abzuziehen (Finanzierungs-Cashflow). Die IFRS-Variante
    mit Abzug der Leasingtilgung kommt in Schritt 7.'
  eingaben:
  - operating_cash_flow
  - capex
  optionale_eingaben:
  - capex_intangibles
  einheit: monetary
  richtung: higher_better
  rundung:
    anzeige: betrag
    nachkommastellen: 0
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_fcf.py
- id: fcf_conversion
  version: '1.0'
  name: FCF-Umwandlung
  formel: FCF / Jahresüberschuss
  definition: Nur bei positivem Jahresüberschuss. Dauerhaft unter 0,8 ist ein Warnsignal.
  eingaben:
  - operating_cash_flow
  - capex
  - net_income
  optionale_eingaben:
  - capex_intangibles
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_fcf_conversion.py
- id: ocf_to_net_income
  version: '1.0'
  name: Operativer Cashflow zu Jahresüberschuss
  formel: Operativer Cashflow / Jahresüberschuss
  definition: Nur bei positivem Jahresüberschuss.
  eingaben:
  - operating_cash_flow
  - net_income
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
