  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_revenue_cagr_5y.py
- id: eps_cagr_5y
  version: '1.0'
  name: Wachstum Gewinn je Aktie 5 Jahre (CAGR)
  formel: (EPS t / EPS t-5) ^ (1/5) - 1
  definition: Verwässertes EPS, um Splits bereinigt, nur bei positivem Anfangs- und Endwert. Rückkaufgetriebenes
    Wachstum zeigt share_count_change_3y.
  eingaben:
  - eps_diluted
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards:
  - standard
  - growth
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_eps_cagr_5y.py
- id: fcf_per_share_cagr_5y
  version: '1.0'
  name: Wachstum FCF je Aktie 5 Jahre (CAGR)
  formel: (FCF/Aktie t / FCF/Aktie t-5) ^ (1/5) - 1
  definition: Aktienzahl verwässert, um Splits bereinigt. Nur bei positivem FCF in beiden Jahren.
  eingaben:
  - operating_cash_flow
  - capex
  - shares_diluted
  optionale_eingaben:
  - capex_intangibles
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_fcf_per_share_cagr_5y.py
- id: share_count_change_3y
  version: '1.0'
  name: Veränderung der Aktienanzahl 3 Jahre
  formel: Aktien t / Aktien t-3 - 1
  definition: Verwässerte gewichtete Aktienanzahl, um Splits bereinigt. Positiv = Verwässerung.
  eingaben:
  - shares_diluted
  einheit: ratio
  richtung: lower_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
