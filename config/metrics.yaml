  - CP-02
  tests:
  - tests/metrics/test_acquisition_intensity.py
- id: piotroski_f_score
  version: '1.0'
  name: Piotroski F-Score
  formel: Summe aus 9 Signalen (0 bis 9)
  definition: ROA > 0, CFO > 0, ROA gestiegen, CFO > ROA (CFO und ROA auf Bilanzsumme zu Jahresbeginn),
    langfristige Verschuldung zu durchschnittlicher Bilanzsumme gesunken, Current Ratio gestiegen, keine
    Ausweitung der verwässerten Aktienanzahl (um Splits bereinigt, Näherung für 'keine neuen Aktien'),
    Bruttomarge gestiegen, Umsatz zu Bilanzsumme zu Jahresbeginn gestiegen.
  eingaben:
  - net_income
  - operating_cash_flow
  - total_assets
  - current_assets
  - current_liabilities
  - shares_diluted
  - revenue
  - gross_profit|cost_of_revenue
  optionale_eingaben:
  - debt_noncurrent
  - debt_long_total
  einheit: pure
  richtung: higher_better
  rundung:
    anzeige: ganzzahl
    nachkommastellen: 2
  scorecards: *id001
  quelle: Piotroski (2000), Journal of Accounting Research 38
  pruefpunkte:
  - CP-01
  - CP-02
  - CP-07
  tests:
  - tests/metrics/test_piotroski_f_score.py
  schwellen:
    solide_ab: 6
- id: altman_z_double_prime
  version: '1.0'
  name: Altman Z'' (Buchwert)
  formel: 6,56 X1 + 3,26 X2 + 6,72 X3 + 1,05 X4
  definition: X1 = (Umlaufvermögen - kurzfristige Verbindlichkeiten) / Bilanzsumme, X2 = Gewinnrücklagen
    / Bilanzsumme, X3 = EBIT / Bilanzsumme, X4 = Buchwert Eigenkapital / Gesamtverbindlichkeiten (gemeldet
    oder Passiva minus Eigenkapital). Warnlampe, keine Wahrscheinlichkeit. Die Variante Z mit Börsenwert
    folgt in Schritt 4.
  eingaben:
  - total_assets
  - current_assets
  - current_liabilities
  - retained_earnings
  - ebit
  - equity
  - total_liabilities|liabilities_and_equity
  einheit: pure
  richtung: higher_better
  rundung:
    anzeige: faktor
    nachkommastellen: 2
  scorecards: *id001
  quelle: Altman, Hotchkiss, Wang (2019), Corporate Financial Distress, Restructuring, and Bankruptcy,
    4. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_altman_z_double_prime.py
  schwellen:
    gefahr_unter: '1.1'
    sicher_ueber: '2.6'
- id: beneish_m_score
  version: '1.0'
  name: Beneish M-Score
  formel: -4,84 + 0,920 DSRI + 0,528 GMI + 0,404 AQI + 0,892 SGI + 0,115 DEPI - 0,172 SGAI + 4,679 TATA
    - 0,327 LVGI
  definition: Acht Indizes aus Jahr t gegen t-1. Wertpapiere im AQI = langfristige Wertpapiere (0, wenn
    nicht gemeldet). Vertriebs- und Verwaltungskosten gemeldet oder Summe der Teile. Über -1,78 Eskalation
    an den Forensik-Agenten F1, kein Ausschluss.
  eingaben:
  - revenue
  - total_assets
  - receivables
  - ppe_net
  - current_assets
  - current_liabilities
  - depreciation
  - net_income
  - operating_cash_flow
  - gross_profit|cost_of_revenue
  - sga|selling_marketing+general_admin
  optionale_eingaben:
  - lt_securities
  - debt_noncurrent
  - debt_long_total
  einheit: pure
  richtung: lower_better
  rundung:
    anzeige: faktor
    nachkommastellen: 2
  scorecards: *id001
  quelle: Beneish (1999), Financial Analysts Journal 55
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_beneish_m_score.py
  schwellen:
    eskalation_ueber: '-1.78'
