  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_revenue_cagr_3y.py
- id: revenue_cagr_5y
  version: '1.0'
  name: Umsatzwachstum 5 Jahre (CAGR)
  formel: (Umsatz t / Umsatz t-5) ^ (1/5) - 1
  definition: Nur bei positivem Anfangs- und Endwert.
  eingaben:
