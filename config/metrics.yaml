# Formelregister, siehe docs/spec/12-analyseformat-und-reproduzierbarkeit.md Abschnitt 12.2.
# Jede Kennzahl hier hat genau eine Funktion in src/stockagent/core/kennzahlen.py oder scores.py,
# registriert über @metric in core/registry.py (HR-06). Jede rechnet schrittweise über den
# Rechenweg aus core/calc.py, `pruefpunkte` sind die Pflicht-Prüfpunkte (HR-19, SPEC 12.7).
# CP-05 (Plausibilität gegen die eigene Historie) läuft für jede Kennzahl als Warnung in
# core/trends.py über die Zeitreihe der Kennzahl.
# Eingaben mit "|" sind Alternativen, "+" eine Summe von Teilen. Optionale Eingaben zählen 0,
# wenn nicht gemeldet, mit Vermerk im Rechenweg.
# Bewertungskennzahlen mit Börsenkurs (`kurs: true`, core/marktkennzahlen.py) seit Bauschritt 4.
# `historie_perzentil: true`: Einordnung gegen die eigenen letzten 10 Jahre (SPEC 3.3).
# `ttm: true`: zusätzlich mit den Werten der letzten 12 Monate bis zum letzten Quartal (Statistik
# `ttm`, core/ttm.py). Nicht für Kennzahlen mit Vorjahresvergleich oder Durchschnitten.

methodology_version: "1.7"

# Kurse für Bewertungskennzahlen (Bauschritt 4, ADR 0005)
kurse:
  max_abstand_tage: 7          # letzter Schlusskurs höchstens so lange vor dem Stichtag

# Trends je Kennzahl (SPEC 3.4, core/trends.py)
# Feste Annahmen der Branchenkennzahlen (Bauschritt 8). Erscheinen als Eingabe mit Quelle
# `config/metrics.yaml parameter.<name>` im Rechenweg
parameter:
  residualgewinn_wachstum: "0"      # g im gerechtfertigten Kurs-Buchwert (vorsichtig: kein Wachstum)
  liquiditaet_hoechst_monate: 120   # Obergrenze der Liquiditätsreichweite (10 Jahre)

trends:
  max_jahre: 10                # Länge der Reihe für Streuung und Steigung
  mindest_jahre: 5             # darunter keine Streuung und keine Steigung (SPEC 3.4 Nr. 1)
  # CP-05 gegen die eigene Historie nutzt config/quality.yaml ausreisser (Schwelle 4,
  # mindestens 4 Vorjahre)

metrics:
- id: gross_margin
  version: '1.0'
  name: Bruttomarge
  formel: Bruttoergebnis / Umsatz
  definition: Bruttoergebnis gemeldet (GrossProfit) oder Umsatz minus Umsatzkosten. Liegen beide vor,
    Gegenrechnung (CP-04). Ohne Umsatzkosten nicht berechenbar (SPEC 3.3).
  eingaben:
  - gross_profit|cost_of_revenue
  - revenue
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: &id001
  - standard
  - growth
  - versorger
  - cyclicals
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_gross_margin.py
  ttm: true
- id: ebit_margin
  version: '1.0'
  name: EBIT-Marge
  formel: EBIT / Umsatz
  definition: EBIT = operatives Ergebnis (OperatingIncomeLoss).
  eingaben:
  - ebit
  - revenue
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_ebit_margin.py
  ttm: true
- id: fcf_margin
  version: '1.0'
  name: FCF-Marge
  formel: Free Cashflow / Umsatz
  definition: FCF wie Kennzahl fcf.
  eingaben:
  - operating_cash_flow
  - capex
  - revenue
  optionale_eingaben:
  - capex_intangibles
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_fcf_margin.py
  ttm: true
- id: gp_to_assets
  version: '1.0'
  name: Bruttoergebnis zu Bilanzsumme
  formel: Bruttoergebnis / Bilanzsumme
  definition: Bilanzsumme zum Jahresende wie bei Novy-Marx.
  eingaben:
  - gross_profit|cost_of_revenue
  - revenue
  - total_assets
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Novy-Marx (2013), The Other Side of Value, Journal of Financial Economics 108
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_gp_to_assets.py
- id: roe
  version: '1.0'
  name: Eigenkapitalrendite
  formel: Jahresüberschuss / durchschnittliches Eigenkapital
  definition: Durchschnitt = (Vorjahresende + Jahresende) / 2. Nicht definiert bei negativem Eigenkapital
    am Anfang oder Ende. Gegenrechnung über DuPont (CP-04).
  eingaben:
  - net_income
  - equity
  - revenue
  - total_assets
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  - CP-04
  tests:
  - tests/metrics/test_roe.py
- id: roa
  version: '1.0'
  name: Gesamtkapitalrendite
  formel: Jahresüberschuss / durchschnittliche Bilanzsumme
  definition: Durchschnitt = (Vorjahresende + Jahresende) / 2.
  eingaben:
  - net_income
  - total_assets
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_roa.py
- id: roic
  version: '1.0'
  name: Rendite auf investiertes Kapital
  formel: NOPAT / durchschnittliches investiertes Kapital
  definition: NOPAT = EBIT * (1 - Steuersatz). Steuersatz = Steuern / Vorsteuerergebnis, begrenzt auf
    [0; 0,35], bei Vorsteuerverlust 0. Investiertes Kapital = Eigenkapital + Finanzschulden + Leasingverbindlichkeiten
    - liquide Mittel. Finanzschulden aus Teilen (zwei Wege mit CP-04), Leasing = Operating + Finance.
  eingaben:
  - ebit
  - income_tax
  - pretax_income
  - equity
  - debt_long_total|debt_noncurrent
  - cash
  optionale_eingaben:
  - debt_current
  - short_term_borrowings
  - commercial_paper
  - lease_operating
  - lease_finance
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_roic.py
- id: dupont
  version: '1.0'
  name: ROE nach DuPont
  formel: Nettomarge * Kapitalumschlag * Hebel
  definition: Nettomarge = Jahresüberschuss / Umsatz, Kapitalumschlag = Umsatz / durchschnittliche Bilanzsumme,
    Hebel = durchschnittliche Bilanzsumme / durchschnittliches Eigenkapital. Die Teile stehen im Rechenweg.
    Muss mit roe übereinstimmen (CP-04).
  eingaben:
  - net_income
  - revenue
  - total_assets
  - equity
  einheit: ratio
  richtung: higher_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
  - CP-04
  tests:
  - tests/metrics/test_dupont.py
- id: revenue_cagr_3y
  version: '1.0'
  name: Umsatzwachstum 3 Jahre (CAGR)
  formel: (Umsatz t / Umsatz t-3) ^ (1/3) - 1
  definition: Nur bei positivem Anfangs- und Endwert.
  eingaben:
