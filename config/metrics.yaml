  - tests/metrics/test_ocf_to_net_income.py
- id: sloan_accruals
  version: '1.0'
  name: Sloan-Accruals
  formel: (Jahresüberschuss - operativer Cashflow) / durchschnittliche Bilanzsumme
  definition: Hohe Werte gehen historisch mit schwächeren Folgerenditen einher. Das Branchendezil kommt
    in Schritt 5.
  eingaben:
  - net_income
  - operating_cash_flow
  - total_assets
  einheit: ratio
  richtung: lower_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Sloan (1996), Do Stock Prices Fully Reflect Information in Accruals and Cash Flows about Future
    Earnings?, The Accounting Review 71
  pruefpunkte:
  - CP-01
  - CP-02
  tests:
  - tests/metrics/test_sloan_accruals.py
  schwellen:
    auffaellig_ueber: '0.10'   # Richtwert, das oberste Dezil nach Sloan (1996) beginnt etwa hier. Branchendezil folgt in Schritt 5
- id: sbc_to_revenue
  version: '1.0'
