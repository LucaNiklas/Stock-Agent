- id: wacc
  version: '1.0'
  name: Kapitalkosten (WACC)
  formel: EK / (EK + FK) * (rf + Beta * ERP) + FK / (EK + FK) * (rf + Aufschlag) * (1 - Steuersatz)
  definition: rf = 10-jährige Staatsanleihe der Berichtswährung (Bundesbank, US-Treasury), ERP =
    implizite Risikoprämie nach Damodaran (Monat), Beta = Branchenbeta nach Damodaran, unverschuldet
    und um Kasse bereinigt, mit der eigenen Verschuldung neu verschuldet. Aufschlag aus dem
    synthetischen Rating nach Zinsdeckung, ohne gemeldeten Zinsaufwand der Branchenaufschlag
    (Vermerk). EK = Börsenwert, FK = Finanzschulden + Leasing. Annahmen in config/kapitalkosten.yaml.
  eingaben:
  - kurs
  - shares_diluted
  - debt_long_total|debt_noncurrent
  - lease_operating
  - rf
  - erp
  - beta_unverschuldet
  - steuersatz
  optionale_eingaben:
  - debt_current
  - short_term_borrowings
  - commercial_paper
  - lease_finance
  - interest_expense
  - kd_branche
  - rf_damodaran
  einheit: percent
  richtung: lower_better
  rundung:
    anzeige: percent
    nachkommastellen: 2
  scorecards:
  - standard
  quelle: Damodaran, Investment Valuation, 3. Auflage, Kapitel 8; SPEC 3.6 Nr. 3; ADR 0006
