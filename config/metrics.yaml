  - tests/metrics/test_sloan_accruals.py
- id: sbc_to_revenue
  version: '1.0'
  name: Aktienbasierte Vergütung zu Umsatz
  formel: Aktienbasierte Vergütung / Umsatz
  definition: ''
  eingaben:
  - sbc
  - revenue
  einheit: ratio
  richtung: lower_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
