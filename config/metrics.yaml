  version: '1.0'
  name: Piotroski F-Score
  formel: Summe aus 9 Signalen (0 bis 9)
  definition: ROA > 0, CFO > 0, ROA gestiegen, CFO > ROA (CFO und ROA auf Bilanzsumme zu Jahresbeginn),
    langfristige Verschuldung zu durchschnittlicher Bilanzsumme gesunken, Current Ratio gestiegen, keine
    Ausweitung der verwässerten Aktienanzahl (um Splits bereinigt, Näherung für 'keine neuen Aktien'),
    Bruttomarge gestiegen, Umsatz zu Bilanzsumme zu Jahresbeginn gestiegen.
