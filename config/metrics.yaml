  formel: -4,84 + 0,920 DSRI + 0,528 GMI + 0,404 AQI + 0,892 SGI + 0,115 DEPI - 0,172 SGAI + 4,679 TATA
    - 0,327 LVGI
  definition: Acht Indizes aus Jahr t gegen t-1. Wertpapiere im AQI = langfristige Wertpapiere (0, wenn
