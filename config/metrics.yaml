  name: Implizites Wachstum (Reverse-DCF)
  formel: g mit Barwert(FCFF * (1 + g)^t, 10 Jahre, WACC) + Endwert = Unternehmenswert
  definition: Hauptverfahren der Bewertung (SPEC 3.6). FCFF = FCF + Zinsaufwand * (1 - Steuersatz).
    Endwachstum = min(risikofreier Zins, 2,5 %). Ist der FCFF nicht positiv, auf Umsatzbasis mit der
    Zielmarge (Median der eigenen FCF-Margen, Branchenmedian ab Schritt 5, Vermerk). Rückrechnung
    CP-06.
  eingaben:
  - kurs
