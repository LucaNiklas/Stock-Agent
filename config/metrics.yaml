  optionale_eingaben:
  - capex_intangibles
  einheit: monetary
  richtung: higher_better
  rundung:
    anzeige: betrag
    nachkommastellen: 0
  scorecards: *id001
  quelle: Koller, Goedhart, Wessels. Valuation (McKinsey), 7. Auflage
  pruefpunkte:
  - CP-01
  - CP-02
