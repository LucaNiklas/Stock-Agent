  kurs: true
  ttm: true
- id: margin_of_safety
  version: '1.0'
  name: Sicherheitsmarge (DCF Base)
  formel: Wert je Aktie im Base-Szenario / Kurs - 1
  definition: Positiv heißt, der Kurs liegt unter dem Wert des Base-Szenarios (SPEC 6.2 Säule Bewertung).
