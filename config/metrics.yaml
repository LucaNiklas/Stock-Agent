  - commercial_paper
  - st_investments
  - lease_finance
  - pension_funded_status
  - equity_incl_nci
  - equity_investments
  einheit: percent
  richtung: lower_better
  rundung:
    anzeige: percent
    nachkommastellen: 1
  scorecards:
  - standard
  quelle: Mauboussin und Rappaport, Expectations Investing (2001, 2021); SPEC 3.6
  pruefpunkte:
  - CP-01
  - CP-02
  - CP-03
  - CP-06
  tests:
