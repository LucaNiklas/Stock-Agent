- id: altman_z_double_prime
  version: '1.0'
  name: Altman Z'' (Buchwert)
  formel: 6,56 X1 + 3,26 X2 + 6,72 X3 + 1,05 X4
  definition: X1 = (Umlaufvermögen - kurzfristige Verbindlichkeiten) / Bilanzsumme, X2 = Gewinnrücklagen
    / Bilanzsumme, X3 = EBIT / Bilanzsumme, X4 = Buchwert Eigenkapital / Gesamtverbindlichkeiten (gemeldet
    oder Passiva minus Eigenkapital). Warnlampe, keine Wahrscheinlichkeit. Die Variante Z mit Börsenwert
    folgt in Schritt 4.
