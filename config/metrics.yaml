- id: growth_gap
  version: '1.0'
  name: Implizites Wachstum minus Historie
  formel: implied_growth - revenue_cagr_5y
  definition: Bewertungsbedingung aus SPEC 3.6. Negativ heißt, der Kurs verlangt weniger Wachstum, als
    die Firma in den letzten 5 Jahren beim Umsatz erreicht hat. Historie über den Umsatz, weil die
    FCF-Wachstumsrate bei Verlustjahren nicht definiert ist (ADR 0007).
