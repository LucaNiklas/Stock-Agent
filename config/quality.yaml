# Schwellen der Datenqualitätsprüfungen (SPEC 3.2). Arithmetik in core/dq.py, Ablauf in
# data/quality.py. Änderung ist eine Methodikänderung (docs/METHODOLOGY_CHANGELOG.md).

version: "1.0"

bilanzgleichung:
  toleranz: "0.005"           # SPEC 3.2 Nr. 1: 0,5 Prozent

summenstruktur:
  toleranz_rel: "0.005"       # wie die Bilanzgleichung
  # Rundung: berichtete Werte sind auf 10^-decimals gerundet. Je Teil eine Rundungseinheit.
  rundung_je_teil: true

abgleich_zweiter_weg:         # SPEC 3.2 Nr. 5
  warnung: "0.01"             # über 1 Prozent
  stopp: "0.05"               # über 5 Prozent
  jahre: 1                    # wie viele der letzten Geschäftsjahre gegen den Originalbericht

ausreisser:                   # SPEC 3.2 Nr. 6, gegen den Trend der Vorjahre (core/dq.py)
  schwelle: "4"
  mindest_historie: 4
  streuung_untergrenze: "0.01" # mindestens 1 % des mittleren Betrags der Vorjahre

split:                        # SPEC 3.2 Nr. 8
  toleranz: "0.02"            # Abstand des Verhältnisses zur nächsten ganzen Zahl
