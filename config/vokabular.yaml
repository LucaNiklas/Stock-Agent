# Größenklassen nach config/scoring.yaml (groessenklassen)
groessen:
  mega: [mega caps, megacaps, mega cap, mega]
  large: [large caps, largecaps, large cap, large, standardwerte, blue chips, bluechips]
  mid: [mid caps, midcaps, mid cap, mid, mittelgroß*]
  small: [small caps, smallcaps, small cap, small, nebenwerte]
  micro: [micro caps, microcaps, micro cap, micro]
  nano: [nano caps, nanocaps, nano cap, nano]

# Kategorie (SPEC 6.5)
kategorien:
  Attraktiv: [attraktiv*]
  Beobachten: [zu beobachten, beobachten]
  Neutral: [neutral*]
  Unattraktiv: [unattraktiv*]
  Eskaliert: [eskaliert*]

# Anlagestile aus config/run_profiles.yaml (stile)
stile:
  qualitaet: [qualität*, qualitaet*, quality]
  bewertung: [günstig*, guenstig*, unterbewertet*, value, preiswert*]
  wachstum: [wachstum*, growth]
  dividende: [dividende*, dividenden*, dividendenstark*, ausschüttung*]
  insider: [insiderkäuf*, insiderkaeuf*, insider käuf*, insider kaeuf*, insider]
  turnaround: [turnaround*]

# Anlagehorizont aus config/horizonte.yaml
horizonte:
  kurz: [kurzfristig*, kurze sicht, kurzer sicht, paar monate, monate]
  mittel: [mittelfristig*, 1 bis 5 jahre, ein paar jahre, wenige jahre]
  lang: [langfristig*, lange sicht, langer sicht, jahrzehnt*]

# Handelbarkeit bei Trade Republic (SPEC 9.7): nur von Luca bestätigte
handelbar: [bei trade republic geprüft*, bei trade republic handelbar*, nur handelbar*, nur geprüft*, handelbar*, geprüft*, bestätigt*]

beobachtungsliste: [beobachtungsliste*, merkliste*, watchlist*]

# Tiefe der Analyse aus config/run_profiles.yaml (tiefe)
tiefe:
  schnell: [nur noten, schnell*]
  standard: [tiefenanalyse*, analysier*]
  tief: [tief analysier*, gründlich*, gruendlich*, tief]

# „bewerte sie“: den Laufplan für „Alle bewerten“ direkt zeigen
bewerten: [bewerte*, benote*]

# Füllwörter ohne Bedeutung für den Filter
fuellwoerter: [aktie, aktien, werte, wert, titel, unternehmen, firmen, firma, konzerne, aus, der, die, das, den, dem, des, in, im, mit, und, oder, von, vom, bei, nur, alle, alles, zeige, zeig, mir, suche, such, finde, bitte, sie, ihn, es, branche, branchen, bereich, sektor, land, region, meine, mein, meiner, caps, cap, hohe, hoher, hohen, hoch, gute, guter, guten, starke, starker, starken, eine, ein, einer, einen, für, fuer, halten, halte, jahre, jahr, sind, ist, welche, was, gibt, aktuell, derzeit, jetzt, heute, liste, an, auf, zu, mal, noch, tier, stufe, note, noten, käufen, kaeufen, käufe, kaeufe, trade, republic, sicht, sowie, plus, dazu, lass, lasse, mach, mache, machen, gib, liefere, nach, the, of, and, stocks, from, companies]

# Wörter, nach denen ein Land oder eine Branche folgt. Ist das nächste Wort unbekannt, wird der
# Satz abgelehnt statt geraten (SPEC 9.9 Nr. 1).
ausloeser:
  land: [aus, land, in]
  branche: [branche, sektor, bereich]
