# Wortliste für die Suche in eigenen Worten (SPEC 9.9, ADR 0014). Version bei Änderung erhöhen.
# Ein Wort mit * am Ende passt auf jeden Wortanfang („deutsch*“ auf deutsche, deutschen). Mehrere
# Wörter stehen für eine feste Wortfolge. Groß- und Kleinschreibung zählt nicht, Bindestriche
# trennen Wörter („US-Aktien“ = „us aktien“). Was hier fehlt, versteht erst das Modell (claude -p),
# und auch das nur mit Werten aus diesen Listen.
version: "1.0"

# Land des Hauptsitzes (ISO 3166). Nur Länder, die im Universum vorkommen können.
laender:
  DE: {name: Deutschland, woerter: [deutschland, deutsch*, germany, german*]}
  AT: {name: Österreich, woerter: [österreich*, oesterreich*, austria*]}
  CH: {name: Schweiz, woerter: [schweiz*, switzerland, swiss]}
  FR: {name: Frankreich, woerter: [frankreich, französisch*, franzoesisch*, france, french]}
  NL: {name: Niederlande, woerter: [niederlande, niederländisch*, holland, holländisch*, netherlands, dutch]}
  BE: {name: Belgien, woerter: [belgien, belgisch*, belgium]}
  LU: {name: Luxemburg, woerter: [luxemburg*]}
  IT: {name: Italien, woerter: [italien*, italy]}
  ES: {name: Spanien, woerter: [spanien, spanisch*, spain]}
  PT: {name: Portugal, woerter: [portugal, portugiesisch*]}
  IE: {name: Irland, woerter: [irland, irisch*, ireland]}
  GB: {name: Großbritannien, woerter: [großbritannien, grossbritannien, britisch*, england, englisch*, uk, vereinigtes königreich, united kingdom]}
  DK: {name: Dänemark, woerter: [dänemark, daenemark, dänisch*, daenisch*, denmark]}
  SE: {name: Schweden, woerter: [schweden, schwedisch*, sweden]}
  "NO": {name: Norwegen, woerter: [norwegen, norwegisch*, norway]}
  FI: {name: Finnland, woerter: [finnland, finnisch*, finland]}
  PL: {name: Polen, woerter: [polen, polnisch*, poland]}
  CZ: {name: Tschechien, woerter: [tschechien, tschechisch*]}
  HU: {name: Ungarn, woerter: [ungarn, ungarisch*]}
  GR: {name: Griechenland, woerter: [griechenland, griechisch*, greece, greek]}
  US: {name: USA, woerter: [usa, us, vereinigte staaten, amerika, amerikanisch*, united states]}
  CA: {name: Kanada, woerter: [kanada, kanadisch*, canada]}
  JP: {name: Japan, woerter: [japan*, japanisch*]}
  AU: {name: Australien, woerter: [australien, australisch*, australia]}
  NZ: {name: Neuseeland, woerter: [neuseeland]}
  HK: {name: Hongkong, woerter: [hongkong, hong kong]}
  SG: {name: Singapur, woerter: [singapur]}
  KR: {name: Südkorea, woerter: [südkorea, suedkorea, korea, koreanisch*]}
  TW: {name: Taiwan, woerter: [taiwan*]}
  CN: {name: China, woerter: [china, chinesisch*]}
  IN: {name: Indien, woerter: [indien, indisch*, india]}
  BR: {name: Brasilien, woerter: [brasilien, brasilianisch*, brazil]}
  MX: {name: Mexiko, woerter: [mexiko, mexikanisch*]}
  ZA: {name: Südafrika, woerter: [südafrika, suedafrika]}
  TR: {name: Türkei, woerter: [türkei, tuerkei, türkisch*]}
  IL: {name: Israel, woerter: [israel*]}
  BM: {name: Bermuda, woerter: [bermuda]}
  JE: {name: Jersey, woerter: [jersey]}

# Regionen. Länder aus config/scoring.yaml (vergleichsgruppe.regionen), außer wo hier `laender`
# steht (DACH ist keine Region der Vergleichsgruppe).
regionen:
  dach: {name: DACH, laender: [DE, AT, CH], woerter: [dach]}
  europa: {name: Europa, woerter: [europa, europäisch*, europaeisch*, europe, european]}
  nordamerika: {name: Nordamerika, woerter: [nordamerika, nordamerikanisch*, north america]}
  asien_pazifik: {name: Asien-Pazifik, woerter: [asien pazifik, asien, asiatisch*, pazifik]}
  schwellenlaender: {name: Schwellenländer, woerter: [schwellenländer*, schwellenlaender*, schwellenland, emerging markets]}

